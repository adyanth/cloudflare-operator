{{- if .Values.rbac.installHelperRoles }}
# Helper ClusterRoles for end-user access to cloudflare-operator CRDs.
# Not used by the operator itself. Auto-generated by hack/helm-sync-rbac.py.
---
# permissions for end users to edit accesstunnels.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cloudflare-operator.fullname" . }}-accesstunnel-editor-role
  labels:
    {{- include "cloudflare-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - networking.cfargotunnel.com
    resources:
      - accesstunnels
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - networking.cfargotunnel.com
    resources:
      - accesstunnels/status
    verbs:
      - get
---
